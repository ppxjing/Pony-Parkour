name: Deploy WebGL to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "WebGLBuild/**"
      - ".github/workflows/deploy-webgl.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and LFS files
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload WebGL site
        uses: actions/upload-pages-artifact@v3
        with:
          path: WebGLBuild

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
