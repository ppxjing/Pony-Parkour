name: Deploy WebGL to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "WebGLBuild/**"
      - ".github/workflows/deploy-webgl.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the browser build
        uses: actions/checkout@v4
        with:
          sparse-checkout: WebGLBuild
          lfs: false

      - name: Download browser build data and check entry point
        run: |
          git lfs install --local
          git lfs pull --include="WebGLBuild/**" --exclude=""
          test -s WebGLBuild/index.html
          if grep -rl '^version https://git-lfs.github.com/spec/v1' WebGLBuild; then
            echo "Unresolved Git LFS pointer in browser build"
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload WebGL site
        uses: actions/upload-pages-artifact@v3
        with:
          path: WebGLBuild

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
